[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netforge"
version = "0.1.0"
description = "C++17 packet crafting/sniffing library with Python bindings"
requires-python = ">=3.8"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["netforge"]